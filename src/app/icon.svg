<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#2D2D44"/>
    </linearGradient>
    <radialGradient id="bead" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#D4A84B"/>
      <stop offset="40%" stop-color="#B8862D"/>
      <stop offset="80%" stop-color="#8B5E3C"/>
      <stop offset="100%" stop-color="#5C3A21"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>

  <!-- Bracelet: 8 beads in a ring with connecting cord visible -->
  <g>
    <!-- Connecting cord between beads -->
    <circle cx="50" cy="50" r="26" fill="none" stroke="#5C3A21" stroke-width="2.5"/>

    <!-- 8 beads evenly spaced -->
    <circle cx="50.0" cy="24.0" r="8.5" fill="url(#bead)" stroke="#3E2414" stroke-width="0.8"/>
    <circle cx="76.0" cy="38.0" r="8.5" fill="url(#bead)" stroke="#3E2414" stroke-width="0.8"/>
    <circle cx="76.0" cy="62.0" r="8.5" fill="url(#bead)" stroke="#3E2414" stroke-width="0.8"/>
    <circle cx="50.0" cy="76.0" r="8.5" fill="url(#bead)" stroke="#3E2414" stroke-width="0.8"/>
    <circle cx="24.0" cy="62.0" r="8.5" fill="url(#bead)" stroke="#3E2414" stroke-width="0.8"/>
    <circle cx="24.0" cy="38.0" r="8.5" fill="url(#bead)" stroke="#3E2414" stroke-width="0.8"/>

    <!-- Subtle highlights on top beads -->
    <ellipse cx="47" cy="21" rx="3" ry="1.8" fill="rgba(255,255,255,0.25)"/>
    <ellipse cx="73" cy="35" rx="3" ry="1.8" fill="rgba(255,255,255,0.2)"/>
  </g>
</svg>
